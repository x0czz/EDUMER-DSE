project:
  type: default
  output-dir: .
  render:
    - reporte_metodologico_dse_codigo.qmd
  resources:
    - assets/favicon-2025-20251031.svg

csl: refs/apa.csl
bibliography: refs/referencias.bib
link-citations: true
reference-location: section

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-copy: true
    code-tools: true
    df-print: paged
    css: assets/styles.scss
    favicon: assets/favicon-2025-20251031.svg
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - includes/justify.html
    include-after-body:
      - includes/logo-link.html
      - includes/citefix.html
      - includes/renumber.html
      - includes/code-toggle.html
      - includes/toc-enhance.html

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  fig-path: "reporte_metodologico_dse_codigo_files/"

lang: es

crossref:
  appendix-title: Anexo
  appendix-delim: " - "

metadata-files:
  - _metadata.yml
